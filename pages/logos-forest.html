<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>로고스 포레스트 — AIGSTACK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --em:#0071e3;
  --bg:#f5f5f7;
  --bg2:#ffffff;
  --br:rgba(0,0,0,.08);
  --br2:rgba(0,113,227,.2);
  --t1:#1d1d1f;
  --t2:#515154;
  --t3:#86868b;
}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;color:var(--t1)}
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* NAV — 반응형 멀티라인 */
nav{
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:.5px solid rgba(0,0,0,0.08);
  position:fixed;top:0;left:0;right:0;z-index:9999;
}
.nav-inner{
  display:flex;flex-direction:row;align-items:center;overflow-x:auto;white-space:nowrap;
  padding:0 16px 0 2px;height:48px;max-width:1280px;margin:0 auto;
}
.logo{display:flex;align-items:center;cursor:pointer;margin-right:8px;flex-shrink:0;}
.logo-main{font-size:13px;font-weight:700;letter-spacing:2.5px;color:#1d1d1f;line-height:1}
.logo-sub{font-size:8px;font-weight:300;letter-spacing:1px;color:rgba(0,0,0,0.4);text-transform:uppercase;margin-left:6px}
.nav-menu{display:flex;align-items:center;gap:3px;flex-wrap:nowrap;}
.nav-item{position:relative}
.nav-btn{
  background:none;border:none;
  color:#1d1d1f;
  font-size:11.5px;font-weight:400;
  padding:4px 9px;cursor:pointer;
  transition:color .2s,background .2s;
  font-family:inherit;letter-spacing:.2px;
  display:flex;align-items:center;white-space:nowrap;
  border-radius:6px;
}
.nav-btn:hover{color:#0071e3;background:rgba(0,113,227,0.06)}
.cpill{display:none}
.nav-contact{display:none}
/* 모바일 — 더 작게 */
@media(max-width:480px){
  .nav-btn{font-size:11px;padding:3px 7px;}
  .nav-inner{padding:6px 12px 5px;}
}
/* 도입 규모별 — 반응형 */
.pricing-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:32px;}
@media(max-width:600px){
  .pricing-grid{grid-template-columns:1fr;}
}
/* 도입 효과 — 반응형 메트릭 */
.metrics-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.metric-card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:12px;padding:18px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.metric-num{font-size:36px;font-weight:700;color:#0071e3;letter-spacing:-1px;line-height:1;flex-shrink:0;min-width:56px;text-align:center;}
.metric-unit{font-size:18px;font-weight:600;}
.metric-body{flex:1;}
.metric-title{font-size:12px;font-weight:600;color:#1d1d1f;margin-bottom:4px;}
.metric-desc{font-size:11px;color:#86868b;line-height:1.55;}
/* 모바일: 1열 가로 레이아웃 */
@media(max-width:600px){
  .metrics-grid{grid-template-columns:1fr;}
  .metric-card{padding:14px 16px;gap:14px;}
  .metric-num{font-size:32px;min-width:52px;}
}

/* BODY */
.body{padding:20px 14px 28px;max-width:800px;margin:0 auto}
.top-label{text-align:center;margin-bottom:18px}
.el{font-size:10px;letter-spacing:3px;color:var(--em);text-transform:uppercase;opacity:.75;margin-bottom:7px}
.etitle{font-size:20px;font-weight:200;color:var(--t1);letter-spacing:-.4px}
.etitle strong{font-weight:500}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border:.5px solid rgba(0,0,0,.08);border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.05)}
.col{position:relative;overflow:hidden}
.col:not(:last-child){border-right:.5px solid rgba(0,0,0,.08)}
canvas.vc{display:block;width:100%}
.zone-top{position:absolute;top:0;left:0;right:0;padding:9px 8px 0;text-align:center;pointer-events:none}
.zt-n{font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:500;opacity:.85}
.zone-bot{position:absolute;bottom:0;left:0;right:0;padding:8px 8px 10px;background:linear-gradient(transparent,rgba(255,255,255,.95));text-align:center;pointer-events:none}
.zb-pct{font-size:15px;font-weight:200;font-family:'SF Mono',monospace;line-height:1;margin-bottom:2px}
.zb-txt{font-size:9px;font-weight:300;line-height:1.4;color:var(--t2)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:9px}
.st{background:#ffffff;border:.5px solid rgba(0,0,0,.08);border-radius:10px;padding:9px 10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.sv{font-size:17px;font-weight:200;font-family:'SF Mono',monospace}
.sl{font-size:10px;color:var(--t3);margin-top:2px;font-weight:300}
.hfooter{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;padding:0 4px}
.ft{font-size:10px;color:var(--t3);display:flex;align-items:center;gap:5px;letter-spacing:.3px}
.ftd{width:4px;height:4px;border-radius:50%;background:var(--em);opacity:.55;flex-shrink:0}
.cta{padding:9px 18px;border-radius:24px;border:.5px solid var(--em);background:rgba(0,113,227,.06);color:var(--em);font-size:12px;cursor:pointer;transition:all .22s;font-family:inherit;text-decoration:none;white-space:nowrap}
.cta:hover{background:var(--em);color:#fff}

/* SECTIONS — 흰 배경 라이트 테마 */
.sec{padding:40px 14px;max-width:800px;margin:0 auto}
.sec-label{font-size:9px;letter-spacing:3px;color:var(--em);text-transform:uppercase;opacity:.7;margin-bottom:8px}
.sec-title{font-size:22px;font-weight:200;color:var(--t1);letter-spacing:-.5px;margin-bottom:6px}
.sec-title strong{font-weight:600;color:var(--t1)}
.sec-sub{font-size:13px;color:var(--t2);font-weight:300;line-height:1.65;margin-bottom:24px;max-width:560px}
.divider{height:.5px;background:var(--br);margin:0 14px}

/* 철학 카드 — 흰 배경 */
.philosophy-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.philosophy-grid{grid-template-columns:1fr}}
.ph-card{
  background:#ffffff;
  border:.5px solid rgba(0,0,0,.08);
  border-radius:12px;padding:16px 18px;
  position:relative;overflow:hidden;
  transition:border-color .2s,box-shadow .2s;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
}
.ph-card:hover{border-color:rgba(0,113,227,.25);box-shadow:0 4px 16px rgba(0,113,227,0.08)}
.ph-name{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--em);text-transform:uppercase;margin-bottom:6px}
.ph-desc{font-size:12px;color:var(--t2);line-height:1.6;font-weight:300}

/* 플랫폼 목록 — 흰 배경 */
.sf-list{display:flex;flex-direction:row;align-items:center;overflow-x:auto;white-space:nowrap;gap:8px}
.sf-item{
  background:#ffffff;
  border:.5px solid rgba(0,0,0,.08);
  border-radius:12px;padding:14px 16px;
  display:flex;align-items:flex-start;gap:14px;
  transition:border-color .2s,box-shadow .2s;
  box-shadow:0 2px 8px rgba(0,0,0,0.03);
}
.sf-item:hover{border-color:rgba(0,113,227,.2);box-shadow:0 4px 16px rgba(0,113,227,0.07)}
.sf-num{font-size:11px;font-family:'SF Mono',monospace;color:var(--em);opacity:.7;min-width:24px;padding-top:2px}
.sf-title{font-size:13px;font-weight:500;color:var(--t1);margin-bottom:3px}
.sf-meta{font-size:11px;color:var(--t2);font-weight:300;line-height:1.5;margin-bottom:4px;}
.sf-tag{display:inline-block;font-size:9px;letter-spacing:.8px;padding:2px 6px;border-radius:4px;margin-right:5px;margin-bottom:4px;font-weight:500}

/* 특허 카드 — 흰 배경 */
.pat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.pat-grid{grid-template-columns:1fr}}
.pat-card{
  background:#ffffff;
  border:.5px solid rgba(0,0,0,.08);
  border-radius:12px;padding:16px 18px;
  transition:border-color .2s,box-shadow .2s;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
}
.pat-card:hover{border-color:rgba(0,113,227,.2);box-shadow:0 4px 16px rgba(0,113,227,0.07)}
.pat-num{font-size:9px;letter-spacing:2px;color:var(--em);opacity:.6;text-transform:uppercase;margin-bottom:6px;font-family:'SF Mono',monospace}
.pat-name{font-size:13px;font-weight:500;color:var(--t1);margin-bottom:6px}
.pat-desc{font-size:11px;color:var(--t2);line-height:1.6;font-weight:300}
.pat-status{display:inline-flex;align-items:center;gap:4px;font-size:9px;margin-top:10px;padding:3px 8px;border-radius:20px}
.pat-filed{background:rgba(0,113,227,.08);border:.5px solid rgba(0,113,227,.25);color:var(--em)}
.pat-pending{background:rgba(255,159,10,.08);border:.5px solid rgba(255,159,10,.25);color:#ff9f0a}

/* 인프라 카드 — 흰 배경 */
.infra-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:480px){.infra-grid{grid-template-columns:1fr}}
.inf-card{
  background:#ffffff;
  border:.5px solid rgba(0,0,0,.08);
  border-radius:12px;padding:14px 16px;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
}
.inf-label{font-size:9px;letter-spacing:1.5px;color:var(--t3);text-transform:uppercase;margin-bottom:8px}
.inf-items{display:flex;flex-direction:row;align-items:center;overflow-x:auto;white-space:nowrap;gap:5px}
.inf-row{display:flex;justify-content:space-between;align-items:center;font-size:11px}
.inf-key{color:var(--t2);font-weight:300}
.inf-val{color:var(--em);font-family:'SF Mono',monospace;font-size:10px}

/* CTA 박스 — 흰 배경 */
.ir-box{
  background:#f5f5f7;
  border:.5px solid rgba(0,0,0,.08);
  border-radius:16px;padding:28px 24px;
  text-align:center;margin-top:0;
}
.ir-title{font-size:18px;font-weight:200;color:var(--t1);margin-bottom:8px}
.ir-title strong{font-weight:600;color:var(--em)}
.ir-sub{font-size:12px;color:var(--t2);margin-bottom:20px;line-height:1.6}
.ir-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ir-btn-main{
  padding:10px 24px;border-radius:24px;
  border:.5px solid var(--em);
  background:var(--em);color:#fff;
  font-size:12px;cursor:pointer;
  transition:all .22s;font-family:inherit;text-decoration:none;
}
.ir-btn-main:hover{background:#005ec7}
.ir-btn-sub{
  padding:10px 24px;border-radius:24px;
  border:.5px solid var(--br);
  background:#ffffff;color:var(--t2);
  font-size:12px;cursor:pointer;
  transition:all .22s;font-family:inherit;text-decoration:none;
}
.ir-btn-sub:hover{border-color:var(--t2);color:var(--t1)}

/* 검증 섹션 — 흰 배경 */
.vf-section{padding:40px 14px;max-width:800px;margin:0 auto}
.vf-hero{text-align:center;margin-bottom:28px}
.vf-eyebrow{font-size:9px;letter-spacing:3px;color:var(--em);text-transform:uppercase;opacity:.7;margin-bottom:10px}
.vf-headline{font-size:22px;font-weight:200;color:var(--t1);letter-spacing:-.5px;margin-bottom:8px}
.vf-headline strong{font-weight:600;color:var(--em)}
.vf-sub{font-size:13px;color:var(--t2);font-weight:300;line-height:1.65;max-width:540px;margin:0 auto}
.vf-banner{
  background:rgba(0,113,227,0.04);
  border:.5px solid rgba(0,113,227,.15);
  border-radius:12px;padding:16px 20px;margin-bottom:24px;
  display:flex;align-items:flex-start;gap:12px;
}
.vf-banner-text{font-size:12px;color:var(--t2);line-height:1.65;font-weight:300}
.vf-banner-text strong{color:var(--em);font-weight:500}
.vf-matrix-label{font-size:9px;letter-spacing:2px;color:var(--t3);text-transform:uppercase;margin-bottom:10px}
.vf-models{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px}
@media(max-width:480px){.vf-models{grid-template-columns:1fr}}
.vf-model-card{
  background:#ffffff;
  border:.5px solid rgba(0,0,0,.08);
  border-radius:12px;padding:14px 16px;
  transition:border-color .2s,box-shadow .2s;cursor:default;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
}
.vf-model-card:hover{border-color:rgba(0,113,227,.2);box-shadow:0 4px 16px rgba(0,113,227,0.07)}
.vf-model-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.vf-model-name{font-size:12px;font-weight:600;letter-spacing:.3px}
.vf-model-badge{font-size:8px;letter-spacing:.8px;padding:2px 7px;border-radius:20px;font-weight:500}
.vf-model-org{font-size:10px;color:var(--t3);font-weight:300;margin-bottom:6px;font-family:'SF Mono',monospace}
.vf-model-method{font-size:10px;color:var(--t2);font-weight:300;line-height:1.5}
.vf-model-method span{color:var(--em);font-weight:500}
.vf-verified-stamp{font-size:9px;letter-spacing:1px;color:var(--em);opacity:.6;margin-top:8px;display:flex;align-items:center;gap:4px}
.vf-verified-stamp::before{content:'✓';font-size:10px;opacity:.8}
.vf-consensus{margin-bottom:24px}
.vf-consensus-title{font-size:9px;letter-spacing:2px;color:var(--t3);text-transform:uppercase;margin-bottom:10px}
.vf-consensus-items{display:flex;flex-direction:row;align-items:center;overflow-x:auto;white-space:nowrap;gap:6px}
.vf-ci{
  display:flex;align-items:center;gap:10px;
  background:#ffffff;
  border:.5px solid rgba(0,0,0,.08);
  border-radius:8px;padding:9px 12px;
  transition:border-color .15s;
  box-shadow:0 1px 4px rgba(0,0,0,0.04);
}
.vf-ci:hover{border-color:rgba(0,113,227,.2)}
.vf-ci-score{font-size:10px;font-family:'SF Mono',monospace;color:var(--em);min-width:32px;font-weight:600}
.vf-ci-bar-wrap{flex:1;height:2px;background:rgba(0,0,0,.06);border-radius:2px;overflow:hidden}
.vf-ci-bar{height:100%;background:linear-gradient(90deg,var(--em),rgba(0,113,227,.4));border-radius:2px}
.vf-ci-label{font-size:11px;color:var(--t2);font-weight:300;min-width:160px;text-align:right}
.vf-meta{
  background:rgba(0,113,227,0.04);
  border:.5px solid rgba(0,113,227,.12);
  border-left:2px solid var(--em);
  border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:24px;
}
.vf-meta-label{font-size:9px;letter-spacing:2px;color:var(--em);text-transform:uppercase;margin-bottom:6px}
.vf-meta-text{font-size:12px;color:var(--t2);line-height:1.7;font-weight:300}
.vf-meta-text strong{color:var(--t1);font-weight:500}
.vf-date{text-align:center;font-size:10px;color:var(--t3);font-family:'SF Mono',monospace;letter-spacing:.5px}
</style>
<style>
/* 자아 투영실 — tt.md 라이트 테마 */
#projection-portal {
  position: fixed;
  top: 48px;
  left: 0;
  width: 100vw;
  height: calc(100vh - 48px);
  background: #f5f5f7;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  color: #1d1d1f;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
}
#projection-portal.active {
  opacity: 1;
  pointer-events: auto;
}
#projection-canvas {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1; pointer-events: none; opacity: 0.15;
}
.portal-header {
  position: relative; z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 24px; height: 52px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid rgba(0,0,0,0.08);
}
.portal-title-area { display: flex; align-items: baseline; gap: 10px; }
.portal-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #1d1d1f; }
.portal-subtitle { font-size: 9px; letter-spacing: 0.8px; color: rgba(0,0,0,0.4); font-weight: 300; }
.portal-close-btn {
  background: none; border: 0.5px solid rgba(0,0,0,0.15);
  color: #515154; font-size: 11px; padding: 5px 14px;
  border-radius: 20px; cursor: pointer; transition: all 0.2s; font-family: inherit;
}
.portal-close-btn:hover { border-color: #0071e3; color: #0071e3; background: rgba(0,113,227,0.05); }
.portal-content {
  position: relative;
  z-index: 5;
  flex: 1;
  display: grid;
  grid-template-columns: 310px 1fr 310px;
  gap: 20px;
  padding: 20px 24px;
  height: calc(100vh - 108px);
  box-sizing: border-box;
}
@media (max-width: 950px) {
  .portal-content {
    grid-template-columns: 1fr;
    overflow-y: auto;
    gap: 16px;
    height: auto;
  }
}
/* 유리의 벽 (Glassmorphism Panels) */
.glass-panel {
  background: #ffffff;
  border: 0.5px solid rgba(0, 0, 0, 0.08);
  border-radius: 16px;
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
  position: relative;
  box-sizing: border-box;
}
.glass-panel::before {
  display: none;
}
.panel-h {
  font-size: 11px;
  letter-spacing: 2px;
  color: #1d1d1f;
  font-weight: 600;
  border-bottom: 0.5px solid rgba(0, 0, 0, 0.08);
  padding-bottom: 8px;
}
.panel-sec {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.panel-label{font-size:10px;color:#86868b;font-weight:400;letter-spacing:.5px}
.freq-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.freq-btn{background:#fff;border:.5px solid rgba(0,0,0,.1);color:#515154;padding:8px 6px;border-radius:8px;font-size:11px;cursor:pointer;transition:all .2s;text-align:center;font-family:inherit;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.freq-btn:hover,.freq-btn.active{background:rgba(0,113,227,.06);border-color:#0071e3;color:#0071e3;box-shadow:0 2px 8px rgba(0,113,227,.12)}
.thought-input-wrap{display:flex;gap:6px;background:#fff;border:.5px solid rgba(0,0,0,.1);border-radius:8px;padding:4px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.thought-input{background:none;border:none;color:#1d1d1f;font-size:11px;padding:6px;flex:1;outline:none;font-family:inherit}
.thought-submit-btn{background:#0071e3;border:none;color:#fff;padding:0 12px;border-radius:6px;cursor:pointer;font-size:10px;transition:all .2s;font-family:inherit}
.thought-submit-btn:hover{background:#0077ed}
.log-list{flex:1;overflow-y:auto;display:flex;flex-direction:row;align-items:center;overflow-x:auto;white-space:nowrap;gap:6px;max-height:240px}
.log-item{background:#fff;border:.5px solid rgba(0,0,0,.07);border-left:2.5px solid #0071e3;padding:8px 10px;border-radius:0 8px 8px 0;font-size:11px;color:#1d1d1f;line-height:1.5;animation:slideIn .3s ease-out;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.log-time{font-family:'SF Mono',monospace;font-size:8.5px;color:#86868b;margin-bottom:4px}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.center-core-wrap{display:flex;flex-direction:row;align-items:center;overflow-x:auto;white-space:nowrap;justify-content:center;align-items:center;position:relative}
.mirror-core{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#f0f4ff 0%,#ffffff 70%);border:1.5px solid rgba(0,113,227,.25);box-shadow:0 8px 40px rgba(0,113,227,.12);display:flex;flex-direction:row;align-items:center;overflow-x:auto;white-space:nowrap;justify-content:center;align-items:center;position:relative;cursor:pointer;transition:transform .35s cubic-bezier(.165,.84,.44,1),box-shadow .3s}
.mirror-core:hover{transform:scale(1.04);box-shadow:0 12px 50px rgba(0,113,227,.2)}
