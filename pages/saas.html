<!DOCTYPE html>

<title>S/W 허브 — AIGSTACK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--em:#0071e3;--bg:#f5f5f7;--bg2:#fff;--br:rgba(0,0,0,.08);--t1:#1d1d1f;--t2:#515154;--t3:#86868b;--nav-h:59px;}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;color:var(--t1);height:100vh;overflow:hidden;}

/* NAV */
nav{background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:.5px solid var(--br);position:fixed;top:0;left:0;right:0;z-index:9999;}
.nav-inner{display:flex;flex-direction:row;align-items:center;padding:0 16px 0 44px;height:48px;max-width:1600px;margin:0 auto;gap:4px;overflow-x:auto;white-space:nowrap;}
.nav-inner::-webkit-scrollbar{display:none;}
.logo{display:flex;align-items:center;cursor:pointer;margin-right:8px;flex-shrink:0;}
.logo-main{font-size:13px;font-weight:700;letter-spacing:2.5px;color:#1d1d1f;}
.logo-sub{font-size:8px;font-weight:300;letter-spacing:1px;color:rgba(0,0,0,.4);text-transform:uppercase;margin-left:6px;}
.nav-menu{display:flex;align-items:center;gap:2px;flex-wrap:nowrap;}
.nav-btn{background:none;border:none;color:#1d1d1f;font-size:11px;font-weight:400;padding:4px 8px;cursor:pointer;transition:color .2s,background .2s;font-family:inherit;letter-spacing:.2px;display:flex;align-items:center;white-space:nowrap;border-radius:6px;text-decoration:none;}
.nav-btn:hover{color:#0071e3;background:rgba(0,113,227,.06);}
.nav-item{position:relative;flex-shrink:0;}

/* LAYOUT */
.app{display:flex;margin-top:48px;height:calc(100vh - 48px);overflow:hidden;}

/* SIDEBAR */
.sidebar{width:200px;flex-shrink:0;background:#fff;border-right:.5px solid var(--br);display:flex;flex-direction:column;overflow-y:auto;}
.sidebar-header{padding:16px 16px 10px;border-bottom:.5px solid var(--br);}
.sidebar-title{font-size:9px;letter-spacing:2px;color:var(--t3);text-transform:uppercase;font-weight:500;}
.cat-list{padding:8px;}
.cat-btn{width:100%;text-align:left;background:none;border:none;padding:7px 10px;border-radius:7px;font-size:12px;color:var(--t2);cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center;transition:all .15s;}
.cat-btn:hover{background:var(--bg);color:var(--t1);}
.cat-btn.active{background:rgba(0,113,227,.08);color:var(--em);font-weight:600;}
.cat-count{font-size:10px;font-family:'SF Mono',monospace;opacity:.6;}

.status-section{padding:8px;border-top:.5px solid var(--br);margin-top:auto;}
.status-title{font-size:9px;letter-spacing:2px;color:var(--t3);text-transform:uppercase;font-weight:500;padding:4px 10px 8px;}
.status-btn{width:100%;text-align:left;background:none;border:none;padding:6px 10px;border-radius:7px;font-size:12px;color:var(--t2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px;transition:all .15s;}
.status-btn:hover{background:var(--bg);}
.status-btn.active{background:rgba(0,113,227,.08);color:var(--em);font-weight:500;}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.dot-green{background:#34c759;box-shadow:0 0 4px rgba(52,199,89,.5);}
.dot-yellow{background:#ff9f0a;}
.dot-gray{background:#aeaeb2;}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* TOOLBAR */
.toolbar{padding:12px 16px;background:#fff;border-bottom:.5px solid var(--br);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.search-wrap{flex:1;position:relative;}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:12px;}
.search-input{width:100%;background:var(--bg);border:.5px solid var(--br);border-radius:8px;padding:7px 10px 7px 28px;font-size:12px;color:var(--t1);outline:none;font-family:inherit;transition:border-color .2s;}
.search-input:focus{border-color:rgba(0,113,227,.4);background:#fff;}
.sort-select{background:var(--bg);border:.5px solid var(--br);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--t2);outline:none;font-family:inherit;cursor:pointer;}
.count-badge{font-size:11px;color:var(--t3);white-space:nowrap;}

/* GRID */
.grid-wrap{flex:1;overflow-y:auto;padding:14px 16px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}

/* CARD */
.card{background:#fff;border:.5px solid var(--br);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .2s;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.card:hover{border-color:rgba(0,113,227,.3);box-shadow:0 4px 16px rgba(0,113,227,.1);transform:translateY(-1px);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.card-cat{font-size:9px;letter-spacing:.8px;text-transform:uppercase;font-weight:600;padding:2px 7px;border-radius:4px;background:rgba(0,113,227,.08);color:var(--em);border:.5px solid rgba(0,113,227,.2);}
.card-status{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--t3);}
.card-title{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:4px;line-height:1.3;}
.card-desc{font-size:11px;color:var(--t2);line-height:1.55;font-weight:300;margin-bottom:10px;}
.card-footer{display:flex;justify-content:space-between;align-items:center;}
.card-session{font-size:10px;font-family:'SF Mono',monospace;color:var(--t3);}
.card-port-btn{font-size:10px;padding:3px 8px;border-radius:5px;border:.5px solid rgba(0,113,227,.3);background:rgba(0,113,227,.06);color:var(--em);cursor:pointer;font-family:'SF Mono',monospace;transition:all .15s;text-decoration:none;}
.card-port-btn:hover{background:var(--em);color:#fff;}

/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--t3);gap:8px;}
.empty-icon{font-size:32px;opacity:.3;}
.empty-text{font-size:13px;font-weight:300;}

/* SCROLLBAR */
.grid-wrap::-webkit-scrollbar{width:4px;}
.grid-wrap::-webkit-scrollbar-track{background:transparent;}
.grid-wrap::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px;}
</style>
</head>

          <a href="/pages/internal.html" style="text-decoration:none;display:block;padding:11px 16px;font-size:13px;color:#1d1d1f;border-bottom:.5px solid rgba(0,0,0,.06);" onmouseover="this.style.background='#f5f5f7'" onmouseout="this.style.background=''">로고스_아이 시연</a>
          <a href="https://aigstack.kr/content/" target="_blank" style="text-decoration:none;display:block;padding:11px 16px;font-size:13px;color:#1d1d1f;" onmouseover="this.style.background='#f5f5f7'" onmouseout="this.style.background=''">광고카피</a>

      <div class="nav-item" style="margin-left:auto;position:relative;">
        <button class="nav-btn" style="color:#86868b;font-size:11px;" onclick="toggleDD('dev-dropdown',event)">🔒 비공개 개발중 ▾</button>

          <a href="/jarvis/" target="_blank" style="text-decoration:none;display:block;padding:8px 12px;border-radius:6px;font-size:12px;color:#1d1d1f;" onmouseover="this.style.background='#f5f5f7'" onmouseout="this.style.background=''"><div style="font-weight:600;">JARVIS Dev</div><div style="font-size:10px;color:#86868b;margin-top:1px;">개발자 JARVIS UI</div></a>

document.addEventListener('click',function(e){if(e.target.closest('nav'))return;['internal-dropdown','dev-dropdown'].forEach(function(id){var d=document.getElementById(id);if(d)d.style.display='none';});});
</script>

<div class="app">

  <div class="sidebar">

    </div>
    <div class="cat-list" id="cat-list"></div>
    <div class="status-section">

      <button class="status-btn" onclick="filterStatus('active', this)">

      </select>
      <span class="count-badge" id="count-badge">0개</span>
    </div>
    <div class="grid-wrap">
      <div class="grid" id="grid"></div>
    </div>
  </div>
</div>

<script>
const RAW_DATA = [
  {title:"SafeJail SaaS",session:"s601-045",port:9043,category:"AI 격리·보안",desc:"1초 SOC2 보안 준수용 서버 격리 관제 패키지",status:"active"},
  {title:"RaftKeep",session:"s601-046",port:9044,category:"분산 DB",desc:"소상공인 SQLite 분산 합의 백업 스토리지",status:"active"},
  {title:"LLMDiet SaaS",session:"s601-047",port:9045,category:"VRAM 최적화",desc:"GPU 호스팅 80% 비용 세이버 및 압축 팩",status:"active"},
  {title:"FloorOpt AI",session:"s601-057",port:9055,category:"엣지 컴퓨팅",desc:"지능형 매장 동선 최적화 히트맵 & 블러링",status:"active"},
  {title:"Logos-Sync",session:"s601-058",port:9056,category:"AI 인프라",desc:"에이전트 전용 MCP 원클릭 API 통합 허브",status:"active"},
  {title:"LOGOS-Land",session:"s601-025",port:9023,category:"B2B 부동산",desc:"지능형 3D 임대차 분쟁 예방 계약·공간 관리",status:"active"},
  {title:"Adventures In Symbolic Algebra With Mode",session:"auto",port:8000,category:"기타",desc:"CREATE TABLE IF NOT EXISTS symbolic_operations (",status:"stopped"},
  {title:"Ask Hn  Pain Points Of Serverless Archit",session:"auto",port:8055,category:"기타",desc:"Ask Hn  Pain Points Of Serverless Archit",status:"stopped"},
  {title:"Ask Hn  Would You Use A Declarative Back",session:"auto",port:8063,category:"기타",desc:"Ask Hn  Would You Use A Declarative Back",status:"stopped"},
  {title:"Cuda 병렬 프로그래밍 가속화를 통한 대규모 딥러닝 추론 효율화",session:"auto",port:8073,category:"기타",desc:"Cuda 병렬 프로그래밍 가속화를 통한 대규모 딥러닝 추론 효율화",status:"stopped"},
  {title:"Edge Js  Run Node Apps Inside A Webassem",session:"auto",port:8790,category:"엣지 컴퓨팅",desc:"Edge Js  Run Node Apps Inside A Webassem",status:"stopped"},
  {title:"Given My Work Experience  What Should I",session:"auto",port:8058,category:"기타",desc:"Given My Work Experience  What Should I",status:"stopped"},
  {title:"I Just Released  Cloud Native Microservi",session:"auto",port:8078,category:"기타",desc:"I Just Released  Cloud Native Microservi",status:"stopped"},
  {title:"Implementing The Raft Distributed Consen",session:"auto",port:8053,category:"분산 DB",desc:"Implementing The Raft Distributed Consen",status:"stopped"},
  {title:"Kubernetes 스케줄링 알고리즘 최적화를 통한 리소스 활용 극대",session:"auto",port:8050,category:"기타",desc:"Kubernetes 스케줄링 알고리즘 최적화를 통한 리소스 활용 극대",status:"stopped"},
  {title:"Linux Landlock 및 Seccomp를 활용한 초경량 로컬",session:"auto",port:8072,category:"AI 격리·보안",desc:"Linux Landlock 및 Seccomp를 활용한 초경량 로컬",status:"stopped"},
  {title:"New 01    융합  Aigstack 차세대 자율 에이전트 인프라 융",session:"auto",port:8047,category:"기타",desc:"New 01    융합  Aigstack 차세대 자율 에이전트 인프라 융",status:"stopped"},
  {title:"New 02  Attacking Firecracker  Aws  Micr",session:"auto",port:8400,category:"기타",desc:"New 02  Attacking Firecracker  Aws  Micr",status:"stopped"},
  {title:"New 03  A Visual Guide To Llm Quantizati",session:"auto",port:8075,category:"VRAM 최적화",desc:"New 03  A Visual Guide To Llm Quantizati",status:"stopped"},
  {title:"New 04  Model Context Protocol",session:"auto",port:8064,category:"기타",desc:"New 04  Model Context Protocol",status:"stopped"},
  {title:"New 05  Seccomp And Landlock Based Appli",session:"auto",port:8105,category:"AI 격리·보안",desc:"New 05  Seccomp And Landlock Based Appli",status:"stopped"},
  {title:"New 06  Open Sourcing Gvisor  A Sandboxe",session:"auto",port:8065,category:"분산 DB",desc:"New 06  Open Sourcing Gvisor  A Sandboxe",status:"stopped"},
  {title:"Programmatic Seo As Early Growth Infrast",session:"auto",port:8060,category:"AI 인프라",desc:"Programmatic Seo As Early Growth Infrast",status:"stopped"},
  {title:"Raft Consensus Protocol",session:"auto",port:8054,category:"분산 DB",desc:"Raft Consensus Protocol",status:"stopped"},
  {title:"Rqlite  Replicated Sqlite Using The Raft",session:"auto",port:8051,category:"분산 DB",desc:"Rqlite  Replicated Sqlite Using The Raft",status:"stopped"},
  {title:"Show Hn  Impulse Xdr  Real Time Threat D",session:"auto",port:8049,category:"기타",desc:"Show Hn  Impulse Xdr  Real Time Threat D",status:"stopped"},
  {title:"Show Hn  Localgpt Gen   Llm Driven World",session:"auto",port:8067,category:"AI 인프라",desc:"Show Hn  Localgpt Gen   Llm Driven World",status:"stopped"}
];

let filtered = [...RAW_DATA];
let activeCategory = '전체';
let activeStatus = 'all';
let searchQ = '';
let sortMode = 'newest';

const STATUS_DOT = {
  active: '<span class="dot dot-green"></span>실행 중',
  stopped: '<span class="dot dot-yellow"></span>정지',
  pending: '<span class="dot dot-gray"></span>미구현',
};

function buildCategories() {
  const counts = {};
  RAW_DATA.forEach(d => { counts[d.category] = (counts[d.category]||0)+1; });
  const list = document.getElementById('cat-list');
  list.innerHTML = `<button class="cat-btn active" onclick="filterCat('전체',this)"><span>전체</span><span class="cat-count">${RAW_DATA.length}</span></button>`;
  Object.entries(counts).sort().forEach(([cat, cnt]) => {
    list.innerHTML += `<button class="cat-btn" onclick="filterCat('${cat}',this)"><span>${cat}</span><span class="cat-count">${cnt}</span></button>`;
  });
}

function render() {
  let data = [...RAW_DATA];
  if (activeCategory !== '전체') data = data.filter(d => d.category === activeCategory);
  if (activeStatus !== 'all') data = data.filter(d => d.status === activeStatus);
  if (searchQ) {
    const q = searchQ.toLowerCase();
    data = data.filter(d =>
      d.title.toLowerCase().includes(q) ||
      d.category.toLowerCase().includes(q) ||
      d.session.toLowerCase().includes(q) ||
      d.desc.toLowerCase().includes(q)
    );
  }
  if (sortMode === 'name') data.sort((a,b) => a.title.localeCompare(b.title));
  else if (sortMode === 'port') data.sort((a,b) => a.port - b.port);
  else if (sortMode === 'cat') data.sort((a,b) => a.category.localeCompare(b.category));

  document.getElementById('count-badge').textContent = `${data.length}개`;
  const grid = document.getElementById('grid');
  if (!data.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1;min-height:300px;"><div class="empty-icon">📭</div><div class="empty-text">검색 결과 없음</div></div>';
    return;
  }
  grid.innerHTML = data.map(d => `
    <div class="card" onclick="openService(${d.port})">
      <div class="card-top">
        <span class="card-cat">${d.category}</span>
        <span class="card-status">${STATUS_DOT[d.status]||''}</span>
      </div>
      <div class="card-title">${d.title}</div>
      <div class="card-desc">${d.desc}</div>
      <div class="card-footer">
        <span class="card-session">${d.session}</span>
        <a class="card-port-btn" href="http://61.77.85.47:${d.port}" target="_blank" onclick="event.stopPropagation()">:${d.port} ↗</a>
      </div>
    </div>
  `).join('');
}

function filterCat(cat, btn) {
  activeCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function filterStatus(s, btn) {
  activeStatus = s;
  document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function onSearch(v) { searchQ = v; render(); }
function onSort(v) { sortMode = v; render(); }
function openService(port) { window.open(`http://61.77.85.47:${port}`, '_blank'); }

// 초기화
buildCategories();
render();
</script>
